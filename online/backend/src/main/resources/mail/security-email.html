<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title></head>
<body style="margin:0;padding:0;background:#0D1224;color:#F4EDFF;font-family:Arial,Helvetica,sans-serif">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0D1224"><tr><td align="center" style="padding:28px 12px">
<!--[if mso]><table role="presentation" width="600" cellspacing="0" cellpadding="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#191D34;border:1px solid #514174;border-radius:20px"><tr><td style="padding:32px 24px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center"><img src="cid:hootly-owl" width="94" height="96" alt="Hootly’s purple owl mascot" style="display:block;border:0;margin:0 auto 12px"><p style="margin:0;color:#F4EDFF;font-size:28px;font-weight:bold;letter-spacing:-1px">Hootly</p><p style="margin:8px 0 22px;color:#B6B0CC;font-size:12px">A little wiser. A lot closer.</p><p style="margin:0 0 24px;color:#FFD064;font-size:14px;letter-spacing:14px" aria-hidden="true">✦ · ✧ · ✦</p></td></tr></table>
<p style="color:#C7A9FF;font-size:14px;margin:0 0 10px">Hello {{name}},</p>
<h1 style="margin:0 0 18px;color:#F4EDFF;font-size:26px;line-height:34px">{{title}}</h1>
<p style="margin:0 0 24px;color:#B6B0CC;font-size:16px;line-height:26px">{{body}}</p>
{{panel}}
<p style="margin:24px 0 0;color:#B6B0CC;font-size:14px;line-height:24px">{{guidance}}</p>
<p style="margin:24px 0 0;color:#C7A9FF;font-size:14px;line-height:24px">See you under the stars.<br><strong style="color:#F4EDFF">The Hootly team</strong></p>
</td></tr></table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table></body></html>
